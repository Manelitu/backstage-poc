# Preencha os valores antes de aplicar:
#   kubectl create secret generic backstage-credentials \
#     --from-literal=POSTGRES_USER=backstage \
#     --from-literal=POSTGRES_PASSWORD=<senha> \
#     --from-literal=AUTH_GITHUB_CLIENT_ID=<id> \
#     --from-literal=AUTH_GITHUB_CLIENT_SECRET=<secret> \
#     --from-literal=GITHUB_TOKEN=<token> \
#     -n backstage
apiVersion: v1
kind: Secret
metadata:
  name: backstage-credentials
  namespace: backstage
type: Opaque
stringData:
  POSTGRES_USER: "backstage"
  POSTGRES_PASSWORD: "changeme"
  AUTH_GITHUB_CLIENT_ID: ""
  AUTH_GITHUB_CLIENT_SECRET: ""
  GITHUB_TOKEN: ""
