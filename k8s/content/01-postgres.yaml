apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-content
  namespace: backstage
  labels:
    app: postgres-content
    component: content
spec:
  serviceName: postgres-content
  replicas: 1
  selector:
    matchLabels:
      app: postgres-content
  template:
    metadata:
      labels:
        app: postgres-content
        component: content
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: backstage-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backstage-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: backstage
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-content
  namespace: backstage
  labels:
    app: postgres-content
    component: content
spec:
  clusterIP: None
  selector:
    app: postgres-content
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
