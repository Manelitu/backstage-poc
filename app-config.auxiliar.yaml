# Overrides for the backend-auxiliar instance.
# Used alongside app-config.yaml:
#   node packages/backend-auxiliar --config app-config.yaml --config app-config.auxiliar.yaml
#
# In production, also add app-config.production.yaml after this file.

backend:
  baseUrl: http://localhost:7008
  listen:
    port: 7008
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
