# docker-compose.yml — Backstage Multi-Backend
#
# Cada backend sobe com seu próprio PostgreSQL dedicado, formando pares
# independentes análogos a pods Kubernetes (backend + sidecar de banco).
#
# ── Pares de serviços (pods) ──────────────────────────────────────────────────
#
#   postgres-auth    <-> backstage-auth     (porta 7008)
#   postgres-core    <-> backstage-core     (porta 7009)
#   postgres-content <-> backstage-content  (porta 7010)
#   postgres-aux     <-> backstage-aux      (porta 7011)
#   postgres-proxy   <-> backstage-proxy    (porta 7007, perfil "full")
#
# ── Modos de uso ─────────────────────────────────────────────────────────────
#
#   Desenvolvimento híbrido (recomendado para dev):
#     docker compose up                        # sobe postgres + feature backends
#     yarn start:frontend                      # sobe proxy (7007) + webpack (3000) locais
#     # acesse http://localhost:3000
#
#   Tudo no Docker (produção/staging):
#     docker compose --profile full up         # inclui o proxy/SPA
#     # acesse http://localhost:7007
#
#   Tudo local (sem Docker):
#     yarn start:all
#
# ── Outros comandos ──────────────────────────────────────────────────────────
#   docker compose build
#   docker compose build --build-arg YARN_ENABLE_STRICT_SSL=false  # SSL corporativo
#
# ── Variáveis de ambiente ────────────────────────────────────────────────────
#   POSTGRES_USER          (padrão: backstage)
#   POSTGRES_PASSWORD      (padrão: backstage)
#   YARN_ENABLE_STRICT_SSL (padrão: true)

x-postgres: &postgres-defaults
  image: postgres:16-alpine
  environment:
    POSTGRES_USER: ${POSTGRES_USER:-backstage}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backstage}
    POSTGRES_DB: backstage
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backstage}"]
    interval: 10s
    timeout: 5s
    retries: 5
  restart: unless-stopped

services:

  # ══════════════════════════════════════════════════════════════════════════
  # POD: Auth (porta 7008)
  # ══════════════════════════════════════════════════════════════════════════

  postgres-auth:
    <<: *postgres-defaults
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data

  backstage-auth:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-auth
      args:
        YARN_ENABLE_STRICT_SSL: ${YARN_ENABLE_STRICT_SSL:-true}
    image: backstage/auth:local
    ports:
      - "7008:7008"
    environment:
      POSTGRES_HOST: postgres-auth
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backstage}
      BACKSTAGE_AUTH_URL: http://backstage-auth:7008
      BACKSTAGE_CORE_URL: http://backstage-core:7009
      BACKSTAGE_CONTENT_URL: http://backstage-content:7010
      BACKSTAGE_AUX_URL: http://backstage-aux:7011
      AUTH_GITHUB_CLIENT_ID: ${AUTH_GITHUB_CLIENT_ID}
      AUTH_GITHUB_CLIENT_SECRET: ${AUTH_GITHUB_CLIENT_SECRET}
    volumes:
      - ./app-config.yaml:/app/app-config.yaml:ro
      - ./app-config.production.yaml:/app/app-config.production.yaml:ro
      - ./packages/backend-auth/app-config.yaml:/app/packages/backend-auth/app-config.yaml:ro
    depends_on:
      postgres-auth:
        condition: service_healthy
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════════════════════
  # POD: Core — Catalog + Permission + Search (porta 7009)
  # ══════════════════════════════════════════════════════════════════════════

  postgres-core:
    <<: *postgres-defaults
    volumes:
      - postgres_core_data:/var/lib/postgresql/data

  backstage-core:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-core
      args:
        YARN_ENABLE_STRICT_SSL: ${YARN_ENABLE_STRICT_SSL:-true}
    image: backstage/core:local
    ports:
      - "7009:7009"
    environment:
      POSTGRES_HOST: postgres-core
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backstage}
      BACKSTAGE_AUTH_URL: http://backstage-auth:7008
      BACKSTAGE_CORE_URL: http://backstage-core:7009
      BACKSTAGE_CONTENT_URL: http://backstage-content:7010
      BACKSTAGE_AUX_URL: http://backstage-aux:7011
    volumes:
      - ./app-config.yaml:/app/app-config.yaml:ro
      - ./app-config.production.yaml:/app/app-config.production.yaml:ro
      - ./packages/backend-core/app-config.yaml:/app/packages/backend-core/app-config.yaml:ro
    depends_on:
      postgres-core:
        condition: service_healthy
      backstage-auth:
        condition: service_started
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════════════════════
  # POD: Content — Scaffolder + TechDocs (porta 7010)
  # ══════════════════════════════════════════════════════════════════════════

  postgres-content:
    <<: *postgres-defaults
    volumes:
      - postgres_content_data:/var/lib/postgresql/data

  backstage-content:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-content
      args:
        YARN_ENABLE_STRICT_SSL: ${YARN_ENABLE_STRICT_SSL:-true}
    image: backstage/content:local
    ports:
      - "7010:7010"
    environment:
      POSTGRES_HOST: postgres-content
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backstage}
      BACKSTAGE_AUTH_URL: http://backstage-auth:7008
      BACKSTAGE_CORE_URL: http://backstage-core:7009
      BACKSTAGE_CONTENT_URL: http://backstage-content:7010
      BACKSTAGE_AUX_URL: http://backstage-aux:7011
    volumes:
      - ./app-config.yaml:/app/app-config.yaml:ro
      - ./app-config.production.yaml:/app/app-config.production.yaml:ro
      - ./packages/backend-content/app-config.yaml:/app/packages/backend-content/app-config.yaml:ro
    depends_on:
      postgres-content:
        condition: service_healthy
      backstage-auth:
        condition: service_started
      backstage-core:
        condition: service_started
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════════════════════
  # POD: Aux — Kubernetes + Notifications + Signals + MCP (porta 7011)
  # ══════════════════════════════════════════════════════════════════════════

  postgres-aux:
    <<: *postgres-defaults
    volumes:
      - postgres_aux_data:/var/lib/postgresql/data

  backstage-aux:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-aux
      args:
        YARN_ENABLE_STRICT_SSL: ${YARN_ENABLE_STRICT_SSL:-true}
    image: backstage/aux:local
    ports:
      - "7011:7011"
    environment:
      POSTGRES_HOST: postgres-aux
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backstage}
      BACKSTAGE_AUTH_URL: http://backstage-auth:7008
      BACKSTAGE_CORE_URL: http://backstage-core:7009
      BACKSTAGE_CONTENT_URL: http://backstage-content:7010
      BACKSTAGE_AUX_URL: http://backstage-aux:7011
    volumes:
      - ./app-config.yaml:/app/app-config.yaml:ro
      - ./app-config.production.yaml:/app/app-config.production.yaml:ro
      - ./packages/backend-aux/app-config.yaml:/app/packages/backend-aux/app-config.yaml:ro
    depends_on:
      postgres-aux:
        condition: service_healthy
      backstage-auth:
        condition: service_started
      backstage-core:
        condition: service_started
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════════════════════
  # POD: Proxy / SPA host (porta 7007) — perfil "full"
  # Só sobe com `docker compose --profile full up`.
  # No modo dev use `yarn start:frontend` (proxy local + webpack).
  # ══════════════════════════════════════════════════════════════════════════

  postgres-proxy:
    <<: *postgres-defaults
    profiles: [full]
    volumes:
      - postgres_proxy_data:/var/lib/postgresql/data

  backstage-proxy:
    profiles: [full]
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-proxy
      args:
        YARN_ENABLE_STRICT_SSL: ${YARN_ENABLE_STRICT_SSL:-true}
    image: backstage/proxy:local
    ports:
      - "7007:7007"
    environment:
      POSTGRES_HOST: postgres-proxy
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backstage}
      BACKSTAGE_AUTH_URL: http://backstage-auth:7008
      BACKSTAGE_CORE_URL: http://backstage-core:7009
      BACKSTAGE_CONTENT_URL: http://backstage-content:7010
      BACKSTAGE_AUX_URL: http://backstage-aux:7011
    volumes:
      - ./app-config.yaml:/app/app-config.yaml:ro
      - ./app-config.production.yaml:/app/app-config.production.yaml:ro
    depends_on:
      postgres-proxy:
        condition: service_healthy
      backstage-auth:
        condition: service_started
      backstage-core:
        condition: service_started
      backstage-content:
        condition: service_started
      backstage-aux:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_auth_data:
  postgres_core_data:
  postgres_content_data:
  postgres_aux_data:
  postgres_proxy_data:
