---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: backstage-poc-domain
spec:
  owner: user:default/manelitu
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: backstage-poc-system
spec:
  owner: user:default/manelitu
  domain: backstage-poc-domain
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-user
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: guest
spec:
  memberOf: [guests]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: manelitu
spec:
  profile:
    email: manelito@sunne.com.br
  memberOf: [guests]
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-group
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: guests
spec:
  type: team
  members: [guest, manelitu]
  children: []
