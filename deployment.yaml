              subPath: app-config.production.yaml
            - name: app-config-core
              mountPath: /app/packages/backend-core/app-config.yaml
              subPath: app-config.yaml
          readinessProbe:
            tcpSocket:
              port: 7009
            initialDelaySeconds: 15
